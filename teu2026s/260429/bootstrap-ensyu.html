<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1>Bootstrap文書書きの練習</h1>
      <p>Bootstrap 5を使って文章を書いてみている。これはpタグ</p>
      <p>文中装飾をいくつか試してみる</p>
      <ul>
        <li><p class="fw-bold">fw-boldを使うと太字</p></li>
        <li><p class="fw-normal">fw-normalは通常の太さ</p></li>
        <li><p class="fw-light">fw-liightを使うと細目の字になる</p></li>
        <li><p class="text-primary">primaryカラーにするにはtext-primaryを使う </p></li>
        <li><p class="fw-bold text-primary">fw-bold + text-primaryの組み合わせ</p></li>
      </ul>
    </div>
  </body>
</html>
